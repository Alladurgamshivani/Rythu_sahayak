services:
  db:
    image: postgres:16-alpine
    container_name: rythu-sahayak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rythu_sahayak
      POSTGRES_USER: rythu_user
      POSTGRES_PASSWORD: rythu_local_password
    ports:
      - "5432:5432"
    volumes:
      - rythu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rythu_user -d rythu_sahayak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rythu_postgres_data:
